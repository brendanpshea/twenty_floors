<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Twenty Floors: puzzle preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a10;
        overscroll-behavior: none;
      }
      #fake-canvas {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 55%, rgba(255, 190, 110, 0.35), transparent 55%),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 64px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 64px),
          linear-gradient(160deg, #3b4a3f, #1f2a2c 55%, #2c2230);
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .pv-bar {
        position: fixed;
        left: 0;
        bottom: 0;
        z-index: 10000;
        font: 12px system-ui, sans-serif;
        color: #ddd;
        max-width: min(420px, 100vw);
      }
      .pv-bar[hidden] {
        display: none;
      }
      .pv-bar button,
      .pv-bar input,
      .pv-bar select {
        font: inherit;
        padding: 4px 6px;
        border: 1px solid #555;
        background: rgba(20, 20, 24, 0.95);
        color: #ddd;
      }
      .pv-bar input[type='number'] {
        width: 60px;
      }
      .pv-body {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        padding: 6px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #333;
      }
      .pv-body[hidden] {
        display: none;
      }
      .pv-out {
        flex-basis: 100%;
        margin: 0;
        max-height: 30vh;
        overflow: auto;
        white-space: pre-wrap;
        color: #9fd;
        font: 11px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="fake-canvas"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/ui/puzzles/preview.ts"></script>
  </body>
</html>
