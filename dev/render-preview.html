<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Twenty Floors: renderer preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a10;
        touch-action: none;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
        color: #e8e4f0;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(10, 8, 16, 0.72);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        max-width: 320px;
        pointer-events: none;
      }
      #hud pre {
        margin: 0;
        font: 12px/1.45 ui-monospace, Consolas, monospace;
      }
      #bar {
        position: fixed;
        top: 8px;
        right: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 360px;
        justify-content: flex-end;
      }
      #bar button {
        font: 12px system-ui, sans-serif;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #6a5f8a;
        background: rgba(30, 24, 48, 0.85);
        color: #e8e4f0;
        cursor: pointer;
      }
      #bar button.on {
        background: #5b4a9a;
        border-color: #a898e8;
      }
      body.shot #hud,
      body.shot #bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"><pre id="stats">starting...</pre></div>
    <div id="bar"></div>
    <script type="module" src="/src/render/preview.ts"></script>
  </body>
</html>
